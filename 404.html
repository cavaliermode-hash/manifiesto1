<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Itinerarios de viaje</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root{--ink:#16301F;--muted:#3B5446;--green:#136c34;--bg:#F3F8F4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif;padding:24px 16px}
  main{max-width:520px;text-align:center;background:#fff;border:1px solid #D5E3D9;border-radius:16px;padding:36px 24px}
  .ic{width:72px;height:72px;border-radius:14px;margin:0 auto 14px;display:block}
  h1{color:var(--green);font-size:26px;margin:0 0 8px}
  p{margin:0 0 20px;color:var(--muted)}
  a.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 22px}
</style>
</head>
<body>
<main>
  <img class="ic" src="/icon-192.png" alt="Manifiesto de itinerarios">
  <h1>Página no encontrada</h1>
  <p>La dirección que abrió no existe o cambió. Regrese al inicio y escriba su nombre completo para consultar su itinerario.</p>
  <a class="btn" href="/">Ir a consultar mi itinerario</a>
</main>
</body>
</html>
