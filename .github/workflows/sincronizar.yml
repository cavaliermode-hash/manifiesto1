name: Sincronizar con manifiesto

# Copia el sitio de cavaliermode-hash/manifiesto a este repositorio (conservando el
# dominio CNAME de aquí) y vuelve a publicar GitHub Pages. Si se sube un data.json
# propio a este repositorio, ese se conserva y ya no se reemplaza con el del original.
on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:        # botón "Run workflow" para sincronizar al momento

permissions:
  contents: write
  pages: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar este repositorio
        uses: actions/checkout@v4
        with:
          path: destino
          fetch-depth: 0   # historial completo para saber quién subió el último data.json

      - name: Descargar el manifiesto original
        uses: actions/checkout@v4
        with:
          repository: cavaliermode-hash/manifiesto
          path: origen

      - name: Copiar archivos
        working-directory: destino
        run: |
          # data.json (lo que genera actualizar.html desde el Excel) se sigue copiando del
          # original hasta que alguien suba uno propio aquí. Desde ese momento este
          # repositorio conserva sus datos y solo se sincronizan las características.
          ULTIMO=$(git log -1 --format=%s -- data.json || true)
          EXTRA=""
          if [ -n "$ULTIMO" ] && [[ "$ULTIMO" != Sincronizar* ]]; then
            echo "data.json propio (\"$ULTIMO\"): se conserva."
            EXTRA="--exclude data.json"
          else
            echo "data.json se copia del original."
          fi
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'CNAME' $EXTRA \
            ../origen/ ./
          echo -n 'www.manifiestodevuelos.net' > CNAME

      - name: Guardar y publicar si hubo cambios
        working-directory: destino
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar con cavaliermode-hash/manifiesto ($(git -C ../origen rev-parse --short HEAD))"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
